name: PR CI & Auto Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  NODE_OPTIONS: --disable-warning=DEP0040

jobs:
  update-pr:
    name: Update Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect pull request metadata
        id: metadata
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF"

          COMMITS="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'- %s')"
          FIRST_COMMIT="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'%s' | tail -n 1)"
          FILES="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          TYPES="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'%s' |
            sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' |
            sort -u |
            paste -sd ', ' -)"

          {
            echo "commits<<EOF"
            printf '%s\n' "${COMMITS:-- Sin commits}"
            echo "EOF"

            echo "files<<EOF"
            printf '%s\n' "${FILES:-- Sin cambios}"
            echo "EOF"

            echo "first_commit<<EOF"
            printf '%s\n' "${FIRST_COMMIT:-Pull request update}"
            echo "EOF"

            echo "types<<EOF"
            printf '%s\n' "${TYPES:-chore}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR title and description
        uses: actions/github-script@v7
        env:
          COMMITS: ${{ steps.metadata.outputs.commits }}
          FILES: ${{ steps.metadata.outputs.files }}
          FIRST_COMMIT: ${{ steps.metadata.outputs.first_commit }}
          TYPES: ${{ steps.metadata.outputs.types }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              throw new Error("Pull request context is unavailable.");
            }

            const commits = process.env.COMMITS || "- Sin commits";
            const files = process.env.FILES || "- Sin cambios";
            const firstCommit = process.env.FIRST_COMMIT || pr.head.ref;
            const types = process.env.TYPES || "chore";
            const baseRef = pr.base.ref;

            // Estados de checks que cuentan como "pasado".
            const PASSED = new Set(["success", "skipped"]);
            // Estados visibles de checks en progreso o sin resultado.
            const PENDING = new Set(["pending", "in_progress", "queued", "requested", "waiting"]);

            const fmt = (result) =>
              PASSED.has(result)
                ? "✅"
                : PENDING.has(result)
                  ? "⏳"
                  : result === "failure" || result === "timed_out" || result === "startup_failure"
                    ? "❌"
                    : "⏳";

            const line = (label, result) => {
              if (!result || result === "not_found") return null;
              return `- ${fmt(result)} ${label} (\`${result}\`)`;
            };

            const workflowRuns = async (workflowId, filters) => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                per_page: 1,
                ...filters,
              });
              return runs[0]?.conclusion ?? runs[0]?.status ?? null;
            };

            // Estado del workflow de tests para el head sha del PR.
            const testResult = await workflowRuns("test.yml", { head_sha: pr.head.sha });

            const checkLines = [
              line("Commitlint", await workflowRuns("commitlint.yml", { head_sha: pr.head.sha })),
              line("Lint", await workflowRuns("lint.yml", { head_sha: pr.head.sha })),
              line("Tests", testResult),
              line("Security", await workflowRuns("security.yml", { head_sha: pr.head.sha })),
            ].filter(Boolean);

            const checklist =
              checkLines.length > 0
                ? checkLines.join("\n")
                : "_Aún no hay checks de CI para este PR._";

            const pagesUrl =
              "https://satoshi-frontend.github.io/starter-scaffolding-react-web/";
            const deployLink =
              baseRef === "main"
                ? pagesUrl
                : baseRef === "develop"
                  ? `${pagesUrl}preview/`
                  : null;

            const pagesWorkflowId =
              baseRef === "main" ? "deploy-main.yml" : "deploy-develop.yml";

            const deployResult = deployLink
              ? await workflowRuns(pagesWorkflowId, { branch: baseRef })
              : null;

            const deploySection = deployLink && deployResult
              ? [
                  "",
                  "## 🚀 Despliegue",
                  deployResult === "success"
                    ? `Se desplego correctamente la rama base \`${baseRef}\`: [${deployLink}](${deployLink})`
                    : `Despliegue \`${deployResult}\` de la rama base \`${baseRef}\`: [${deployLink}](${deployLink})`,
                ].join("\n")
              : "";

            const formattedFiles = files
              .split("\n")
              .filter((file) => file.length > 0)
              .map((file) => `- \`${file}\``)
              .join("\n") || "- Sin cambios";

            const body = [
              "## 🧾 Descripción",
              "Este PR incluye los siguientes cambios:",
              "",
              "## 🔄 Cambios realizados",
              commits,
              "",
              "## 📂 Archivos modificados",
              formattedFiles,
              "",
              "## 🏷️ Tipo de cambio",
              `\`${types}\``,
              "",
              "## ☑️ Checklist CI",
              checklist,
              deploySection,
              "",
              "_PR actualizado automáticamente por CI_ 🤖",
            ].join("\n");

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: firstCommit,
              body,
            });
