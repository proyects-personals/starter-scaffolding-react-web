name: PR Auto Labels

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Detect and apply PR labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect change signals
        id: signals
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="${{ github.base_ref }}"

          FILES="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          TYPES="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'%s' |
            sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' |
            tr '[:upper:]' '[:lower:]' |
            sort -u |
            paste -sd ' ' -)"

          {
            echo "files<<EOF"
            printf '%s\n' "${FILES:-(none)}"
            echo "EOF"

            echo "types<<EOF"
            printf '%s\n' "${TYPES:-chore}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply labels
        uses: actions/github-script@v7
        env:
          FILES: ${{ steps.signals.outputs.files }}
          TYPES: ${{ steps.signals.outputs.types }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              throw new Error("Pull request context is unavailable.");
            }

            const files = (process.env.FILES || "").split("\n").filter(Boolean);
            const types = (process.env.TYPES || "").split(" ").filter(Boolean);

            // Cada label con su color para poder crearla si falta en el repo.
            const LABELS = {
              typescript: {
                name: "typescript",
                color: "3178c6",
                description: "Cambios en codigo TypeScript",
              },
              storybook: {
                name: "storybook",
                color: "ff69b4",
                description: "Cambios en historias de Storybook",
              },
              documentation: {
                name: "documentation",
                color: "0075ca",
                description: "Cambios en documentacion",
              },
              actions: {
                name: "github-actions",
                color: "000000",
                description: "Cambios en CI y workflows",
              },
              styles: {
                name: "styles",
                color: "5319e7",
                description: "Cambios de estilos y temas",
              },
              tests: {
                name: "tests",
                color: "0e8a16",
                description: "Cambios en pruebas unitarias",
              },
              feature: {
                name: "feature",
                color: "a2eeef",
                description: "Nueva funcionalidad",
              },
              bug: {
                name: "bug",
                color: "d73a4a",
                description: "Correccion de defecto",
              },
              chore: {
                name: "chore",
                color: "cccccc",
                description: "Mantenimiento y tareas de rutina",
              },
              refactor: {
                name: "refactor",
                color: "fbca04",
                description: "Refactorizacion sin cambio de comportamiento",
              },
            };

            const has = (glob) =>
              files.some((file) => new RegExp(glob).test(file));

            const wanted = new Set();

            // Content area: what is touched.
            if (has("\\.(ts|tsx)$")) {
              wanted.add(LABELS.typescript.name);
            }
            if (has("(^|/)\\.storybook/|^stories/.*\\.stories\\.(ts|tsx)$")) {
              wanted.add(LABELS.storybook.name);
            }
            if (has("\\.(md|mdx)$|(^|/)LICENSE$")) {
              wanted.add(LABELS.documentation.name);
            }
            if (has("(^|/)\\.github/")) {
              wanted.add(LABELS.actions.name);
            }
            if (has("\\.(css|scss)($|\\.)|tailwind")) {
              wanted.add(LABELS.styles.name);
            }
            if (has("(\\.test\\.(ts|tsx)$|\\.spec\\.(ts|tsx)$|(^|/)test/)")) {
              wanted.add(LABELS.tests.name);
            }

            // Intent: conventional commit types in the PR.
            for (const type of types) {
              if (type === "feat" || type === "feature") {
                wanted.add(LABELS.feature.name);
              } else if (type === "fix" || type === "bugfix") {
                wanted.add(LABELS.bug.name);
              } else if (type === "docs") {
                wanted.add(LABELS.documentation.name);
              } else if (type === "chore" || type === "ci") {
                wanted.add(LABELS.chore.name);
              } else if (type === "refactor") {
                wanted.add(LABELS.refactor.name);
              } else if (type === "test") {
                wanted.add(LABELS.tests.name);
                wanted.add(LABELS.typescript.name);
              } else if (type === "style") {
                wanted.add(LABELS.styles.name);
              }
            }

            if (types.length === 0) {
              wanted.add(LABELS.chore.name);
            }

            // Labels que faltan en el repo se crean automaticamente con su
            // color y descripcion; asi el labeler nunca se queda mudo.
            const existing = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const existingNames = new Set(existing.map((l) => l.name));

            for (const label of Object.values(LABELS)) {
              if (!existingNames.has(label.name)) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  existingNames.add(label.name);
                  core.info(`Created label: ${label.name}`);
                } catch (error) {
                  core.warning(
                    `No se pudo crear la label ${label.name}: ${error.message}`,
                  );
                }
              }
            }

            // Keep labels a human added manually.
            const autoNames = Object.values(LABELS).map((l) => l.name);
            const manual = pr.labels
              .map((l) => l.name)
              .filter((name) => !autoNames.includes(name));

            const toApply = [...wanted].filter((name) =>
              existingNames.has(name),
            );

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [...new Set([...manual, ...toApply])],
            });

            core.info(`Applied labels: ${[...manual, ...toApply].join(", ")}`);
