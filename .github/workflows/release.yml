name: Release

on:
  # Corre cuando Version Bump termina: asi el release siempre lee la version
  # NUEVA que el bump escribio en package.json (v0.0.1, v1.2.3, ...).
  workflow_run:
    workflows: ["Version Bump"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Crear release de la version del package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version from package.json
        id: version
        run: |
          set -euo pipefail

          # La version la gobierna version-bump.yml sobre el package.json;
          # el release toma esa version tal cual (v0.0.1, v1.2.3, ...).
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "exists=$(git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Collect release notes
        if: steps.version.outputs.exists == 'false'
        id: notes
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          # Notas desde el tag anterior (o la historia completa si es el primero).
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          {
            echo "notes<<EOF"
            git log ${RANGE} --pretty=format:"- %s (%h)" || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          set -euo pipefail

          {
            echo "## Release ${TAG}"
            echo ""
            echo "${NOTES:-- Sin cambios registrados.}"
          } > RELEASE_NOTES.md

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file RELEASE_NOTES.md

          rm RELEASE_NOTES.md
          echo "Release ${TAG} creado (version ${VERSION} del package.json)."