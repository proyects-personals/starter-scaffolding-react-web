name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilación de producción
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout library (Satoshi-librerias/satoshi-rc-ui, ref = rama destino)
        uses: actions/checkout@v4
        with:
          repository: Satoshi-librerias/satoshi-rc-ui
          ref: ${{ github.base_ref || github.ref_name }}
          token: ${{ secrets.LIBRARY_ACCESS_TOKEN || github.token }}
          path: lib

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and install library
        run: |
          mkdir -p resource
          cd lib
          npm install --legacy-peer-deps
          npm run build:lib
          # npm pack nombra el tgz segun el name del package.json de la rama
          # (@satoshi-rc-ui -> satoshi-rc-ui-1.0.0.tgz, react-ui -> react-ui-1.0.0.tgz).
          # Se estandariza el nombre para que coincida con la dependencia del scaffold.
          npm pack --ignore-scripts --pack-destination ../resource
          cd ..
          TARBALL=$(ls resource/*.tgz | head -n 1)
          if [ -z "${TARBALL}" ]; then echo "::error::npm pack no genero ningún tgz en resource/"; exit 1; fi
          echo "Tarball generado: ${TARBALL}"
          if [ "${TARBALL}" != "resource/satoshi-rc-ui-1.0.0.tgz" ]; then
            mv "${TARBALL}" resource/satoshi-rc-ui-1.0.0.tgz
          fi
          ls -la resource/

      - name: Install dependencies
        run: npm install && npm install ./resource/satoshi-rc-ui-*.tgz

      - name: Run build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist
          retention-days: 7
          if-no-files-found: error
