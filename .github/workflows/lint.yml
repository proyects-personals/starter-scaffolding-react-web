name: Lint & Format

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint y Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout library (Satoshi-librerias/satoshi-rc-ui, ref = rama destino)
        uses: actions/checkout@v4
        with:
          repository: Satoshi-librerias/satoshi-rc-ui
          ref: ${{ github.base_ref || github.ref_name }}
          token: ${{ secrets.LIBRARY_ACCESS_TOKEN || github.token }}
          path: lib

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and install library
        run: |
          mkdir -p resource
          cd lib
          npm install --legacy-peer-deps
          npm run build:lib
          npm pack --ignore-scripts --pack-destination ../resource
          cd ..
          # El tgz se genera con el name real del package.json de la rama
          # (react-ui en main, @satoshi-rc-ui en develop). Se renombra a
          # satoshi-rc-ui para que coincida con la dependencia del scaffold.
          TARBALL=$(ls ../resource/*.tgz | head -n 1)
          echo "Tarball generado: ${TARBALL}"
          mv "${TARBALL}" ../resource/satoshi-rc-ui-1.0.0.tgz
          ls -la ../resource/

      - name: Install dependencies
        run: npm install && npm install ./resource/satoshi-rc-ui-*.tgz

      - name: Run ESLint
        run: |
          mkdir -p reports
          npx eslint 'src/**/*.{ts,tsx,js,jsx}' --max-warnings=0
          npx eslint 'src/**/*.{ts,tsx,js,jsx}' -f html -o reports/eslint-report.html

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,scss,md}"

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: reports/eslint-report.html
          retention-days: 7
          if-no-files-found: warn
