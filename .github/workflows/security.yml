name: Security & Dependencies

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stub local library package
        run: |
          # El package.json declara la dependencia file:resource/satoshi-rc-ui-*.tgz.
          # Este workflow no usa la librería, así que se genera un stub mínimo
          # para que npm install no falle con ENOENT.
          mkdir -p resource/stub/package
          node -e "
            const fs = require('fs');
            fs.writeFileSync('resource/stub/package/package.json', JSON.stringify({
              name: 'satoshi-rc-ui',
              version: '0.0.0-stub',
            }, null, 2));
          "
          tar czf resource/satoshi-rc-ui-1.0.0.tgz -C resource/stub package
          rm -rf resource/stub

      - name: Install dependencies
        run: npm install

      - name: Audit NPM packages
        id: audit
        shell: bash
        run: |
          mkdir -p reports

          set +e
          npm audit --json > reports/npm-audit.json
          AUDIT_EXIT_CODE=$?
          set -e

          echo "exit_code=$AUDIT_EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ -s reports/npm-audit.json ]; then
            cat reports/npm-audit.json
          else
            echo "::warning::npm audit did not generate a report."
          fi

          if [ "$AUDIT_EXIT_CODE" -ne 0 ]; then
            echo "::warning::npm audit returned exit code $AUDIT_EXIT_CODE."
            echo "::warning::Review the security report for vulnerabilities or audit errors."
          fi

      - name: Check outdated packages
        if: always()
        run: npm outdated || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/npm-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce security audit result
        if: always() && steps.audit.outputs.exit_code != '0'
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          echo "::error::Security audit failed with exit code ${AUDIT_EXIT_CODE}."
          echo "Review the uploaded security report and resolve the reported issues."
          exit 1
