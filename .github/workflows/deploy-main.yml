name: Deploy Main

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pages:
    name: Desplegar main (produccion) + mantener develop (preview)
    uses: ./.github/workflows/pages-reusable.yml
    with:
      primary_ref: main
      secondary_ref: develop
      primary_base: /starter-scaffolding-react-web/
      secondary_base: /starter-scaffolding-react-web/preview/
      primary_slot: .
      secondary_slot: preview
    secrets: inherit
