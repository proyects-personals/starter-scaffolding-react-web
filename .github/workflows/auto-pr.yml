name: Auto Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-pr:
    name: Actualizar título y descripción del PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect pull request metadata
        id: metadata
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF"

          COMMITS="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'- %s')"
          FIRST_COMMIT="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'%s' | tail -n 1)"
          FILES="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          TYPES="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'%s' \
            | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' \
            | sort -u \
            | paste -sd ', ' -)"

          # URL de Pages segun la rama destino del PR (deploy-main o deploy-develop).
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

          {
            echo "commits<<EOF"
            printf '%s\n' "${COMMITS:-- Sin commits}"
            echo "EOF"

            echo "files<<EOF"
            printf '%s\n' "${FILES:-- Sin cambios}"
            echo "EOF"

            echo "first_commit<<EOF"
            printf '%s\n' "${FIRST_COMMIT:-Pull request update}"
            echo "EOF"

            echo "types<<EOF"
            printf '%s\n' "${TYPES:-chore}"
            echo "EOF"

            echo "pages_url=${PAGES_URL}"
            echo "base_ref=${BASE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Check CI checks status
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            // Consulta el estado de los check runs del head commit del PR.
            // Cada item del checklist CI se marca solo si su check paso;
            // si no existe o esta en curso/fallido, queda sin marcar.
            const pr = context.payload.pull_request;
            const { data: runs } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
              per_page: 100,
            });

            const byWorkflow = {};
            for (const run of runs.check_runs) {
              if (run.status !== "completed") continue;
              byWorkflow[run.name] = run.conclusion === "success";
            }

            const match = (keywords) =>
              Object.entries(byWorkflow).some(([name, ok]) =>
                keywords.some((k) => name.toLowerCase().includes(k)),
              );

            const ci = {
              commitlint: match(["commitlint", "pr lint", "validate pr title"]),
              lint: match(["lint", "eslint", "prettier"]),
              tests: match(["test", "type-check"]),
              security: match(["security", "audit"]),
            };

            core.setOutput("commitlint", ci.commitlint ? "true" : "false");
            core.setOutput("lint", ci.lint ? "true" : "false");
            core.setOutput("tests", ci.tests ? "true" : "false");
            core.setOutput("security", ci.security ? "true" : "false");
            core.setOutput("all_passed", Object.values(ci).every(Boolean) ? "true" : "false");

      - name: Update PR title and description
        uses: actions/github-script@v7
        env:
          COMMITS: ${{ steps.metadata.outputs.commits }}
          FILES: ${{ steps.metadata.outputs.files }}
          FIRST_COMMIT: ${{ steps.metadata.outputs.first_commit }}
          TYPES: ${{ steps.metadata.outputs.types }}
          PAGES_URL: ${{ steps.metadata.outputs.pages_url }}
          BASE_REF: ${{ steps.metadata.outputs.base_ref }}
          CHECK_COMMITLINT: ${{ steps.checks.outputs.commitlint }}
          CHECK_LINT: ${{ steps.checks.outputs.lint }}
          CHECK_TESTS: ${{ steps.checks.outputs.tests }}
          CHECK_SECURITY: ${{ steps.checks.outputs.security }}
          CHECK_ALL_PASSED: ${{ steps.checks.outputs.all_passed }}
        with:
          script: |
            const pr = context.payload.pull_request;

            const commits = process.env.COMMITS || "- Sin commits";
            const files = process.env.FILES || "- Sin cambios";
            const firstCommit = process.env.FIRST_COMMIT || pr.head.ref;
            const types = process.env.TYPES || "chore";
            const pagesUrl = process.env.PAGES_URL;
            const baseRef = process.env.BASE_REF;
            const allPassed = process.env.CHECK_ALL_PASSED === "true";

            const formattedFiles = files
              .split("\n")
              .filter((file) => file.length > 0)
              .map((file) => `- \`${file}\``)
              .join("\n") || "- Sin cambios";

            // Checklist CI: cada item se marca solo si su check paso.
            const box = (passed) => (passed === "true" ? "[x]" : "[ ]");
            const checklist = [
              "## ☑️ Checklist CI",
              `- ${box(process.env.CHECK_COMMITLINT)} Commitlint`,
              `- ${box(process.env.CHECK_LINT)} Lint`,
              `- ${box(process.env.CHECK_TESTS)} Tests`,
              `- ${box(process.env.CHECK_SECURITY)} Security audit`,
              "",
              allPassed
                ? "_Todos los checks de CI pasaron._"
                : "_Algunos checks siguen en curso o fallaron; la lista se actualiza en cada push al PR._",
              ""
            ];

            // Seccion de despliegue: solo para PRs hacia main o develop, y con
            // estado de despliegue real consultado a los workflows de Pages.
            let deploySection;
            if (["main", "develop"].includes(baseRef)) {
              let deployStatus = "pendiente (se ejecuta al fusionar en `" + baseRef + "`)";
              let deployed = false;
              try {
                const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 30,
                });
                const targetBranch = baseRef;
                const deployRun = runs.workflow_runs.find(
                  (r) =>
                    r.name.toLowerCase().startsWith("deploy ") &&
                    r.head_branch === targetBranch &&
                    r.status === "completed",
                );
                if (deployRun) {
                  deployed = deployRun.conclusion === "success";
                  const when = new Date(deployRun.updated_at).toISOString().slice(0, 16).replace("T", " ") + " UTC";
                  deployStatus = deployed
                    ? "desplegado correctamente (" + when + ")"
                    : "ultimo despliegue fallo (" + when + ")";
                }
              } catch (e) {
                core.warning("No se pudo consultar el estado de despliegue: " + e.message);
              }

              deploySection = [
                "## 🚀 Despliegue",
                `Este PR se despliega a GitHub Pages al fusionarse en \`${baseRef}\`:`,
                "",
                `**🔍 Ver despliegue: [${pagesUrl}](${pagesUrl})**`,
                "",
                `**Estado:** ${deployed ? "✅" : "⚠️"} ${deployStatus}.`,
                "",
                baseRef === "develop"
                  ? "_El despliegue de develop muestra un banner naranja para distinguirlo de producción._"
                  : "_Despliegue de producción (sin banner)._",
                ""
              ];
            } else {
              deploySection = [
                "## 🚀 Despliegue",
                "Esta rama destino no tiene despliegue automático a GitHub Pages.",
                ""
              ];
            }

            const body = [
              "## 🧾 Descripción",
              "Este PR incluye los siguientes cambios:",
              "",
              "## 🔄 Cambios realizados",
              commits,
              "",
              "## 📂 Archivos modificados",
              formattedFiles,
              "",
              "## 🏷️ Tipo de cambio",
              `\`${types}\``,
              "",
              ...deploySection,
              ...checklist,
              "_PR actualizado automáticamente por CI_ 🤖",
            ].join("\n");

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: firstCommit,
              body,
            });
