name: PR CI & Auto Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: auto-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-pr:
    name: Update Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Update PR title and description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.info("No hay un PR abierto asociado a este evento; se omite.");
              return;
            }

            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Metadatos via API (no depende de git checkout ni de la rama base).
            const commitsData = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const subjects = commitsData.map((c) => c.commit.message.split("\n")[0]);
            const commits = subjects.map((s) => `- ${s}`).join("\n") || "- Sin commits";
            const firstCommit = subjects[0] || prData.head.ref;
            const types =
              [...new Set(
                subjects
                  .map((s) => (s.match(/^([a-zA-Z]+)(\([^)]*\))?!?:.*/) || [])[1])
                  .filter(Boolean),
              )].join(", ") || "chore";

            const filesData = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const formattedFiles =
              filesData.map((f) => `- \`${f.filename}\``).join("\n") || "- Sin cambios";

            // Resuelve el id numérico de un workflow buscando en la lista
            // completa: la API da 404 si el filename no existe en la rama
            // por defecto. Se acepta filename o nombre del workflow.
            const workflowIdByName = {};
            try {
              const workflows = await github.paginate(github.rest.actions.listWorkflows, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              for (const wf of workflows) {
                workflowIdByName[wf.path.split("/").pop()] = wf.id;
                workflowIdByName[wf.name.toLowerCase()] = wf.id;
              }
            } catch (error) {
              core.warning(`No se pudo listar workflows: ${error.message}`);
            }

            const findWorkflowId = (nameOrFile) =>
              workflowIdByName[nameOrFile] ?? workflowIdByName[nameOrFile.replace(/\.ya?ml$/, "")];

            // Devuelve la conclusión SOLO si el run del workflow ya terminó.
            // Si está encolado, en progreso o no existe, devuelve null y la
            // línea no se marca.
            const completed = async (workflowNameOrFile, filters) => {
              const id = findWorkflowId(workflowNameOrFile);
              if (!id) return null;
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: id,
                  per_page: 10,
                  ...filters,
                });
                const run = data.workflow_runs[0];
                return run && run.status === "completed" ? run.conclusion : null;
              } catch (error) {
                core.warning(`No se pudo consultar ${workflowNameOrFile}: ${error.message}`);
                return null;
              }
            };

            const sha = prData.head.sha;

            // Espera (polling) a que TODOS los checks CI del PR terminen.
            // GitHub no dispara check_run para checks creados con
            // GITHUB_TOKEN del mismo repo, así que se consulta cada 15 s
            // (máx. 10 min). Devuelve el mapa label -> conclusion.
            const CI_WORKFLOWS = [
              ["Commitlint", "commitlint.yml"],
              ["Lint", "lint.yml"],
              ["Tests", "test.yml"],
              ["Security", "security.yml"],
            ];
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const POLL_INTERVAL_MS = 15_000;
            const POLL_TIMEOUT_MS = 10 * 60_000;

            const results = {};
            const deadline = Date.now() + POLL_TIMEOUT_MS;
            while (Date.now() < deadline) {
              for (const [label, file] of CI_WORKFLOWS) {
                if (results[label]) continue;
                const conclusion = await completed(file, { head_sha: sha });
                if (conclusion) results[label] = conclusion;
              }
              if (CI_WORKFLOWS.every(([label]) => results[label])) break;
              core.info(
                `Checks pendientes: ${CI_WORKFLOWS.filter(([label]) => !results[label])
                  .map(([, file]) => file)
                  .join(", ")} — reintentando en 15 s...`,
              );
              await sleep(POLL_INTERVAL_MS);
            }

            const icon = (conclusion) =>
              conclusion === "success" ? "✅" : "❌";

            const line = (label, conclusion) =>
              conclusion && conclusion !== "skipped"
                ? `- ${icon(conclusion)} ${label} (\`${conclusion}\`)`
                : null;

            // Solo se listan los checks que terminaron; los que no corrieron
            // o siguen pendientes no se marcan.
            const checkLines = CI_WORKFLOWS.map(([label]) => line(label, results[label])).filter(
              Boolean,
            );

            const checklist =
              checkLines.length > 0
                ? checkLines.join("\n")
                : "_Los checks de CI no terminaron a tiempo; revisa la pestaña Actions._";

            // Sección de despliegue: solo si ya existe un run completado.
            const baseRef = prData.base.ref;
            const pagesUrl =
              "https://satoshi-frontend.github.io/starter-scaffolding-react-web/";
            const deployLink =
              baseRef === "main"
                ? pagesUrl
                : baseRef === "develop"
                  ? `${pagesUrl}preview/`
                  : null;

            let deploySection = "";
            if (deployLink) {
              // Soporta tanto el esquema unificado (deploy.yml) como los
              // workflows por rama (deploy-main.yml / deploy-develop.yml).
              const candidates =
                baseRef === "main"
                  ? ["deploy-main.yml", "deploy.yml"]
                  : ["deploy-develop.yml", "deploy.yml"];
              let deployConclusion = null;
              for (const candidate of candidates) {
                deployConclusion = await completed(candidate, { branch: baseRef });
                if (deployConclusion) break;
              }
              if (deployConclusion && deployConclusion !== "skipped") {
                deploySection = [
                  "",
                  "## 🚀 Despliegue",
                  deployConclusion === "success"
                    ? `Se desplego correctamente la rama base \`${baseRef}\`: [${deployLink}](${deployLink})`
                    : `Despliegue \`${deployConclusion}\` de la rama base \`${baseRef}\`: [${deployLink}](${deployLink})`,
                ].join("\n");
              }
            }

            const body = [
              "## 🧾 Descripción",
              "Este PR incluye los siguientes cambios:",
              "",
              "## 🔄 Cambios realizados",
              commits,
              "",
              "## 📂 Archivos modificados",
              formattedFiles,
              "",
              "## 🏷️ Tipo de cambio",
              `\`${types}\``,
              "",
              "## ☑️ Checklist CI",
              checklist,
              deploySection,
              "",
              "_PR actualizado automáticamente por CI_ 🤖",
            ].join("\n");

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: firstCommit,
              body,
            });
