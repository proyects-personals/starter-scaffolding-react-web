name: Deploy Develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  pages:
    name: Desplegar develop (preview) + mantener main (produccion)
    uses: ./.github/workflows/pages-reusable.yml
    with:
      primary_ref: develop
      secondary_ref: main
      primary_base: /starter-scaffolding-react-web/preview/
      secondary_base: /starter-scaffolding-react-web/
      primary_slot: preview
      secondary_slot: .
      banner: develop
    secrets: inherit
