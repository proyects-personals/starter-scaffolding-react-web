name: PR CI & Auto Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  NODE_OPTIONS: --disable-warning=DEP0040

jobs:
  ci:
    name: CI Validation
    runs-on: ubuntu-latest
    outputs:
      commitlint: ${{ steps.ci-results.outputs.commitlint }}
      lint: ${{ steps.ci-results.outputs.lint }}
      security_audit: ${{ steps.ci-results.outputs.security_audit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stub local library package
        run: |
          # El package.json declara la dependencia file:resource/satoshi-rc-ui-*.tgz.
          # Este workflow no usa la librería, así que se genera un stub mínimo
          # para que npm install no falle con ENOENT.
          mkdir -p resource/stub/package
          node -e "
            const fs = require('fs');
            fs.writeFileSync('resource/stub/package/package.json', JSON.stringify({
              name: 'satoshi-rc-ui',
              version: '0.0.0-stub',
            }, null, 2));
          "
          tar czf resource/satoshi-rc-ui-1.0.0.tgz -C resource/stub package
          rm -rf resource/stub

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commitlint
        id: commitlint
        run:
          npx --no-install commitlint --from="origin/${{ github.base_ref }}"
          --to=HEAD --verbose

      - name: Lint
        id: lint
        run: npm run lint:check

      - name: Security audit
        id: security-audit
        run: npm audit --audit-level=high

      - name: Export CI step results
        id: ci-results
        if: always()
        env:
          COMMITLINT_RESULT: ${{ steps.commitlint.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          SECURITY_AUDIT_RESULT: ${{ steps.security-audit.outcome }}
        run: |
          {
            echo "commitlint=${COMMITLINT_RESULT:-skipped}"
            echo "lint=${LINT_RESULT:-skipped}"
            echo "security_audit=${SECURITY_AUDIT_RESULT:-skipped}"
          } >> "$GITHUB_OUTPUT"

  update-pr:
    name: Update Pull Request
    needs: ci
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect pull request metadata
        id: metadata
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF"

          COMMITS="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'- %s')"
          FIRST_COMMIT="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'%s' | tail -n 1)"
          FILES="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          TYPES="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'%s' |
            sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' |
            sort -u |
            paste -sd ', ' -)"

          {
            echo "commits<<EOF"
            printf '%s\n' "${COMMITS:-- Sin commits}"
            echo "EOF"

            echo "files<<EOF"
            printf '%s\n' "${FILES:-- Sin cambios}"
            echo "EOF"

            echo "first_commit<<EOF"
            printf '%s\n' "${FIRST_COMMIT:-Pull request update}"
            echo "EOF"

            echo "types<<EOF"
            printf '%s\n' "${TYPES:-chore}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR title and description
        uses: actions/github-script@v7
        env:
          COMMITS: ${{ steps.metadata.outputs.commits }}
          FILES: ${{ steps.metadata.outputs.files }}
          FIRST_COMMIT: ${{ steps.metadata.outputs.first_commit }}
          TYPES: ${{ steps.metadata.outputs.types }}
          COMMITLINT_RESULT: ${{ needs.ci.outputs.commitlint }}
          LINT_RESULT: ${{ needs.ci.outputs.lint }}
          SECURITY_AUDIT_RESULT: ${{ needs.ci.outputs.security_audit }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              throw new Error("Pull request context is unavailable.");
            }

            const commits = process.env.COMMITS || "- Sin commits";
            const files = process.env.FILES || "- Sin cambios";
            const firstCommit = process.env.FIRST_COMMIT || pr.head.ref;
            const types = process.env.TYPES || "chore";
            const baseRef = pr.base.ref;

            const checkmark = (result) =>
              result === "success" ? "x" : " ";

            const commitlintResult = process.env.COMMITLINT_RESULT || "skipped";
            const lintResult = process.env.LINT_RESULT || "skipped";
            const securityResult = process.env.SECURITY_AUDIT_RESULT || "skipped";

            const unitTestRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "test.yml",
                head_sha: pr.head.sha,
                per_page: 1,
              },
            );
            const testResult = unitTestRuns[0]?.conclusion ?? "pending";

            const checklist = [
              `- [${checkmark(commitlintResult)}] Commitlint (\`${commitlintResult}\`)`,
              `- [${checkmark(lintResult)}] Lint (\`${lintResult}\`)`,
              `- [${checkmark(testResult)}] Tests (\`${testResult}\`)`,
              `- [${checkmark(securityResult)}] Security audit (\`${securityResult}\`)`,
            ].join("\n");

            const pagesUrl =
              "https://satoshi-frontend.github.io/starter-scaffolding-react-web/";
            const deployLink =
              baseRef === "main"
                ? pagesUrl
                : baseRef === "develop"
                  ? `${pagesUrl}preview/`
                  : null;

            const pagesWorkflowId =
              baseRef === "main" ? "deploy-main.yml" : "deploy-develop.yml";

            const pagesRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: pagesWorkflowId,
                branch: baseRef,
                per_page: 1,
              },
            );
            const deployResult = pagesRuns[0]?.conclusion ?? "pending";

            const deploySection = deployLink
              ? [
                  "",
                  "## 🚀 Despliegue",
                  deployResult === "success"
                    ? `Se desplego correctamente la rama base \`${baseRef}\`: [${deployLink}](${deployLink})`
                    : `Despliegue \`${deployResult}\` de la rama base \`${baseRef}\`: [${deployLink}](${deployLink})`,
                ].join("\n")
              : "";

            const formattedFiles = files
              .split("\n")
              .filter((file) => file.length > 0)
              .map((file) => `- \`${file}\``)
              .join("\n") || "- Sin cambios";

            const body = [
              "## 🧾 Descripción",
              "Este PR incluye los siguientes cambios:",
              "",
              "## 🔄 Cambios realizados",
              commits,
              "",
              "## 📂 Archivos modificados",
              formattedFiles,
              "",
              "## 🏷️ Tipo de cambio",
              `\`${types}\``,
              "",
              "## ☑️ Checklist CI",
              checklist,
              deploySection,
              "",
              "_PR actualizado automáticamente por CI_ 🤖",
            ].join("\n");

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: firstCommit,
              body,
            });
