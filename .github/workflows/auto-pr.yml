name: PR CI & Auto Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: auto-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-pr:
    name: Update Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Update PR title and description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.info("No hay un PR abierto asociado a este evento; se omite.");
              return;
            }

            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Metadatos via API (no depende de git checkout ni de la rama base).
            const commitsData = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const subjects = commitsData.map((c) => c.commit.message.split("\n")[0]);
            const commits = subjects.map((s) => `- ${s}`).join("\n") || "- Sin commits";
            const firstCommit = subjects[0] || prData.head.ref;
            const types =
              [...new Set(
                subjects
                  .map((s) => (s.match(/^([a-zA-Z]+)(\([^)]*\))?!?:.*/) || [])[1])
                  .filter(Boolean),
              )].join(", ") || "chore";

            const filesData = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const formattedFiles =
              filesData.map((f) => `- \`${f.filename}\``).join("\n") || "- Sin cambios";

            // Resuelve las conclusiones de los checks del head del PR usando
            // la API de Checks (igual que gh pr checks). A diferencia de
            // listWorkflowRuns con head_sha, aqui si se ven los runs de
            // pull_request porque GitHub los registra con el SHA del merge
            // commit y listForRef los expone por nombre de check.
            const CI_CHECK_NAMES = [
              "Compilación de producción",
              "ESLint y Prettier",
              "Type-check y Tests",
              "Security and Dependency Audit",
              "Validar mensajes de commit",
              "Validar título del PR",
              "Detect and apply PR labels",
            ];

            const fetchChecks = async (ref) => {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                per_page: 100,
              });
              return data.check_runs ?? [];
            };

            const headRef = prData.head.ref;

            // Espera (polling) a que TODOS los checks CI del PR terminen.
            // GitHub no dispara check_run para checks creados con
            // GITHUB_TOKEN del mismo repo, así que se consulta cada 15 s
            // (máx. 10 min). Devuelve el mapa nombre -> conclusion.
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const POLL_INTERVAL_MS = 15_000;
            const POLL_TIMEOUT_MS = 10 * 60_000;

            const results = {};
            const deadline = Date.now() + POLL_TIMEOUT_MS;
            while (Date.now() < deadline) {
              let checkRuns = [];
              try {
                checkRuns = await fetchChecks(headRef);
              } catch (error) {
                core.warning(`No se pudo consultar checks: ${error.message}`);
              }
              const completedRuns = checkRuns.filter((run) => run.status === "completed");
              for (const run of completedRuns) {
                if (!(run.name in results)) results[run.name] = run.conclusion;
              }
              const pendingNames = CI_CHECK_NAMES.filter(
                (name) => !(name in results),
              );
              if (pendingNames.length === 0) break;
              core.info(
                `Checks pendientes: ${pendingNames.join(", ")} — reintentando en 15 s...`,
              );
              await sleep(POLL_INTERVAL_MS);
            }

            const icon = (conclusion) =>
              conclusion === "success" ? "✅" : "❌";

            const line = (name, conclusion) =>
              conclusion && conclusion !== "skipped"
                ? `- ${icon(conclusion)} ${name} (\`${conclusion}\`)`
                : null;

            // Solo se listan los checks que terminaron; los que no corrieron
            // o siguen pendientes no se marcan.
            const checkLines = CI_CHECK_NAMES.map((name) => line(name, results[name])).filter(
              Boolean,
            );

            const checklist =
              checkLines.length > 0
                ? checkLines.join("\n")
                : "_Los checks de CI no terminaron a tiempo; revisa la pestaña Actions._";

            // Sección de despliegue: solo si ya existe un run completado.
            const baseRef = prData.base.ref;
            const pagesUrl =
              "https://satoshi-frontend.github.io/starter-scaffolding-react-web/";
            const deployLink =
              baseRef === "main"
                ? pagesUrl
                : baseRef === "develop"
                  ? `${pagesUrl}preview/`
                  : null;

            let deploySection = "";
            if (deployLink) {
              // Los deploys corren en push a la rama base, no en el PR, asi
              // que se consulta el ultimo run completado del workflow de
              // despliegue de esa rama (no de head_sha, que nunca coincidiria).
              const deployWorkflow =
                baseRef === "main" ? "deploy-main.yml" : "deploy-develop.yml";
              let deployStatus = null;
              let deployRunUrl = deployLink;
              try {
                const { data: runsData } =
                  await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: deployWorkflow,
                    branch: baseRef,
                    per_page: 5,
                  });
                const run = runsData.workflow_runs.find(
                  (r) => r.status === "completed",
                );
                if (run) {
                  deployStatus = run.conclusion;
                  deployRunUrl = run.html_url;
                }
              } catch (error) {
                core.warning(
                  `No se pudo consultar el despliegue: ${error.message}`,
                );
              }

              if (deployStatus) {
                deploySection = [
                  "",
                  "## 🚀 Despliegue",
                  deployStatus === "success"
                    ? `El ultimo despliegue de \`${baseRef}\` fue exitoso: [ver run](${deployRunUrl}) - [sitio](${deployLink})`
                    : `Ultimo despliegue de \`${baseRef}\`: \`${deployStatus}\` - [ver run](${deployRunUrl}) - [sitio](${deployLink})`,
                ].join("\n");
              } else {
                deploySection = [
                  "",
                  "## 🚀 Despliegue",
                  `Aun no hay despliegues registrados para \`${baseRef}\`. Se ejecutara al hacer push a la rama base: [sitio](${deployLink})`,
                ].join("\n");
              }
            }

            // Etiquetas actuales del PR (aplicadas por pr-labels.yml o a mano).
            // Se recargan justo antes de armar el cuerpo para reflejar lo
            // que el workflow de labels ya aplico en este mismo push.
            let labels = "_Sin etiquetas_";
            try {
              const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              const labelNames = currentLabels.map((l) => l.name);
              if (labelNames.length > 0) {
                labels = labelNames.map((name) => `- \`${name}\``).join("\n");
              }
            } catch (error) {
              core.warning(`No se pudieron listar las etiquetas: ${error.message}`);
            }

            const body = [
              "## 🧾 Descripción",
              "Este PR incluye los siguientes cambios:",
              "",
              "## 🔄 Cambios realizados",
              commits,
              "",
              "## 📂 Archivos modificados",
              formattedFiles,
              "",
              "## 🏷️ Tipo de cambio",
              `\`${types}\``,
              "",
              "## 🏷️ Etiquetas",
              labels,
              "",
              "## ☑️ Checklist CI",
              checklist,
              deploySection,
              "",
              "_PR actualizado automáticamente por CI_ 🤖",
            ].join("\n");

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: firstCommit,
              body,
            });
